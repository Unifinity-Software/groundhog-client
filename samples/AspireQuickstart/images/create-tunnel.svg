<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Create a tunnel: choose a name and keep the key</title>
  <desc id="desc">Illustration. Enter aspire-quickstart in Name, the name used in AppHost/Program.cs. Leave the local port default for Aspire. Create the tunnel and copy its connection key.</desc>
  <rect width="920" height="360" rx="16" fill="#f3f5f8"/>
  <g font-family="Arial, sans-serif" fill="#182338">
    <text x="28" y="40" font-size="13" fill="#526178">GROUNDHOG · WALKTHROUGH ILLUSTRATION</text>
    <text x="28" y="77" font-size="26" font-weight="bold">Create your tunnel</text>
    <rect x="28" y="99" width="430" height="232" rx="12" fill="white" stroke="#cbd4e1"/>
    <text x="48" y="128" font-size="16" font-weight="bold">Name</text>
    <rect x="48" y="142" width="390" height="42" rx="6" fill="#f8fafc" stroke="#8495ad"/>
    <text x="60" y="169" font-size="17" font-family="monospace">aspire-quickstart</text>
    <text x="48" y="213" font-size="16" font-weight="bold">Local port</text>
    <text x="48" y="239" font-size="15" fill="#526178">Leave the website's default for Aspire.</text>
    <rect x="48" y="268" width="158" height="42" rx="7" fill="#2158b0"/>
    <text x="64" y="295" font-size="16" fill="white">Create tunnel</text>
    <text x="495" y="132" font-size="20" font-weight="bold">1. Keep the name</text>
    <text x="495" y="160" font-size="16">You will put it in AppHost/Program.cs.</text>
    <text x="495" y="210" font-size="20" font-weight="bold">2. Copy the new connection key</text>
    <text x="495" y="238" font-size="16">The next screen shows it once.</text>
    <text x="495" y="287" font-size="16" fill="#526178">Aspire chooses the web app's local port.</text>
    <text x="495" y="311" font-size="16" fill="#526178">No port needs to be copied into the sample.</text>
  </g>
</svg>
