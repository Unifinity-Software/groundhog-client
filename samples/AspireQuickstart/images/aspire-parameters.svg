<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Enter the tunnel name and connection key in Aspire</title>
  <desc id="desc">Illustration. groundhog-name is aspire-quickstart. groundhog-key is the private connection key. Enable Save to user secrets, then submit. No relay address is required.</desc>
  <rect width="920" height="420" rx="16" fill="#f3f5f8"/>
  <g font-family="Arial, sans-serif" fill="#182338">
    <text x="28" y="40" font-size="13" fill="#526178">ASPIRE · WALKTHROUGH ILLUSTRATION</text>
    <text x="28" y="77" font-size="26" font-weight="bold">Two values, then save</text>
    <rect x="28" y="99" width="440" height="293" rx="12" fill="white" stroke="#cbd4e1"/>
    <text x="48" y="132" font-size="16" font-weight="bold">groundhog-name</text>
    <rect x="48" y="146" width="400" height="42" rx="6" fill="#f8fafc" stroke="#8495ad"/>
    <text x="60" y="173" font-size="17" font-family="monospace">aspire-quickstart</text>
    <text x="48" y="221" font-size="16" font-weight="bold">groundhog-key</text>
    <rect x="48" y="235" width="400" height="42" rx="6" fill="#f8fafc" stroke="#8495ad"/>
    <text x="60" y="262" font-size="20">••••••••••••••••••••••••</text>
    <rect x="48" y="299" width="22" height="22" rx="4" fill="#2158b0"/>
    <path d="m53 310 4 4 8-10" fill="none" stroke="white" stroke-width="2"/>
    <text x="80" y="316" font-size="16">Save to user secrets</text>
    <rect x="48" y="340" width="112" height="35" rx="7" fill="#2158b0"/>
    <text x="74" y="364" font-size="16" fill="white">Submit</text>
    <text x="502" y="144" font-size="20" font-weight="bold">1. Name only</text>
    <text x="502" y="172" font-size="16">Use the name created on the website.</text>
    <text x="502" y="224" font-size="20" font-weight="bold">2. Paste your connection key</text>
    <text x="502" y="252" font-size="16">Use the key for this same tunnel.</text>
    <text x="502" y="307" font-size="20" font-weight="bold">3. Remember it on this computer</text>
    <text x="502" y="335" font-size="16">Enable the toggle before submitting.</text>
    <text x="502" y="377" font-size="15" fill="#526178">The hosted service address is automatic.</text>
  </g>
</svg>
