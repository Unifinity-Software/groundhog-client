name: Visual Studio extension

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified VSIX to Visual Studio Marketplace
        type: boolean
        default: false
      host_validated:
        description: The experimental-host checklist passed on supported Visual Studio versions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visualstudio-release
  cancel-in-progress: false

jobs:
  visualstudio:
    runs-on: windows-latest
    environment: vscode
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json
      - name: Build shared request inspector
        working-directory: ide/vscode
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build native extension and VSIX
        run: dotnet build ide/visualstudio/Groundhog.VisualStudio.csproj -c Release
      - name: Verify VSIX and isolated stdio transport
        shell: powershell
        run: ./ide/visualstudio/Verify-Vsix.ps1
      - name: Check Marketplace publisher
        id: publisher
        run: |
          $tools = dotnet msbuild ide/visualstudio/Groundhog.VisualStudio.csproj -getProperty:VSSDKToolsPath
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $publisher = Join-Path $tools.Trim() 'lib/VsixPublisher.exe'
          if (-not (Test-Path -LiteralPath $publisher)) { throw 'The restored Visual Studio SDK build tools must include VsixPublisher.' }
          & $publisher version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "path=$publisher" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v6
        with:
          name: groundhog-visualstudio
          path: ide/visualstudio/bin/Release/net472/Groundhog.VisualStudio.vsix
          if-no-files-found: error
      - name: Publish to Visual Studio Marketplace
        if: inputs.publish
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VSCE_PAT }}
          HOST_VALIDATED: ${{ inputs.host_validated }}
          VSIX_PUBLISHER: ${{ steps.publisher.outputs.path }}
        run: |
          if ($env:HOST_VALIDATED -ne 'true') { throw 'Run the experimental-host checklist before publishing.' }
          if (-not $env:VS_MARKETPLACE_TOKEN) { throw 'VSCE_PAT must be configured for the unifinity publisher.' }
          & $env:VSIX_PUBLISHER publish -payload ide/visualstudio/bin/Release/net472/Groundhog.VisualStudio.vsix -publishManifest ide/visualstudio/publishManifest.json -personalAccessToken $env:VS_MARKETPLACE_TOKEN
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
