<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<title id="title">The client connection</title><desc id="desc">The Agent initiates an encrypted outbound WebSocket to the relay. The relay sends concurrent HTTP/2 request streams back through it; the Agent forwards to a local HTTP or HTTPS app. A visitor reaches the public relay using HTTPS.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#00707c" stroke-width="1.5"/></marker></defs>
<rect width="900" height="400" rx="10" fill="#f4f7fa"/>
<g font-family="Arial,sans-serif" fill="#0d1b2a">
<text x="32" y="46" font-size="25" font-weight="700">One public address. Your app stays local.</text>
<rect x="30" y="135" width="190" height="125" rx="6" fill="#fff" stroke="#73869a"/>
<text x="48" y="171" font-size="20" font-weight="700">Public relay</text><text x="48" y="200" font-size="15">Accepts visitor HTTPS</text><text x="48" y="226" font-size="15">Routes by tunnel name</text>
<rect x="466" y="106" width="406" height="196" rx="8" fill="none" stroke="#73869a" stroke-dasharray="5 4"/>
<text x="482" y="130" font-size="14">Your computer — no inbound internet port</text>
<rect x="482" y="154" width="166" height="112" rx="6" fill="#fff" stroke="#73869a"/>
<text x="499" y="186" font-size="20" font-weight="700">Agent</text><text x="499" y="216" font-size="15">CLI / Aspire / library</text><text x="499" y="242" font-size="15">Public Host retained</text>
<rect x="706" y="154" width="150" height="112" rx="6" fill="#fff" stroke="#73869a"/>
<text x="720" y="186" font-size="20" font-weight="700">Local app</text><text x="720" y="216" font-size="15">HTTP or HTTPS</text><text x="720" y="242" font-size="15">App authentication</text>
<path d="M482 166L222 166" stroke="#00707c" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="151" font-size="14">1. Agent opens outbound TLS connection</text>
<path d="M220 239L480 239" stroke="#00707c" stroke-width="2" marker-end="url(#arrow)"/><text x="243" y="264" font-size="14">2. Relay sends HTTP/2 request streams</text>
<path d="M648 207L704 207" stroke="#00707c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="350" font-size="16">Responses travel back through the same connection. Two connections by default; configure 1–8.</text>
</g></svg>
